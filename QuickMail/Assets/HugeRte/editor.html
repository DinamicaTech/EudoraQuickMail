<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>QuickMail HTML editor</title>
  <script src="hugerte.min.js"></script>
  <style>html,body,#editor{height:100%;margin:0}body{overflow:hidden}</style>
</head>
<body>
  <textarea id="editor" aria-label="HTML message body"></textarea>
  <script>
    let quickMailEditor;
    let quickMailSelectionBookmark;
    let preservedHeadStyles = '';
    let quickMailLanguage = '';
    let quickMailSpellTimer;

    const decodeUtf8Base64 = value => {
      const bytes = Uint8Array.from(atob(value), c => c.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    };

    const emitContent = () => {
      if (!quickMailEditor) return;
      const clone = quickMailEditor.getBody().cloneNode(true);
      clone.querySelectorAll('[data-quickmail-spelling]').forEach(span => span.replaceWith(...span.childNodes));
      clone.querySelectorAll('[data-quickmail-menu]').forEach(menu => menu.remove());
      const body = clone.innerHTML;
      const html = '<!doctype html><html><head><meta charset="utf-8">' +
        preservedHeadStyles + '</head><body>' + body + '</body></html>';
      const plain = quickMailEditor.getContent({ format: 'text' });
      chrome.webview.postMessage(JSON.stringify({ html, plain }));
    };

    const requestCatalanProofing = () => {
      if (!quickMailEditor || quickMailLanguage !== 'ca-ES') return;
      clearTimeout(quickMailSpellTimer);
      quickMailSpellTimer = setTimeout(() => {
        const body = quickMailEditor.getBody();
        const words = new Set();
        const walker = body.ownerDocument.createTreeWalker(body, NodeFilter.SHOW_TEXT, {
          acceptNode: node => node.parentElement?.closest('[data-quickmail-menu]')
            ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT
        });
        while (walker.nextNode())
          for (const match of walker.currentNode.data.matchAll(/[\p{L}·'’\-]+/gu)) words.add(match[0]);
        chrome.webview.postMessage(JSON.stringify({ type: 'catalan-spell', words: [...words] }));
      }, 450);
    };

    const closeQuickMailMenu = () => quickMailEditor?.getBody()
      .querySelectorAll('[data-quickmail-menu]').forEach(menu => menu.remove());

    // HugeRTE bookmarks are DOM-path based. Catalan proofing deliberately splits text
    // nodes to add wavy underlines, so restoring such a bookmark can land several words
    // to the left. Text offsets survive that reshaping because proofing never changes the
    // actual characters in the message.
    const captureTextSelection = () => {
      const body = quickMailEditor.getBody();
      const range = quickMailEditor.selection.getRng();
      if (!body.contains(range.startContainer) || !body.contains(range.endContainer)) return null;
      const beforeStart = body.ownerDocument.createRange();
      beforeStart.selectNodeContents(body); beforeStart.setEnd(range.startContainer, range.startOffset);
      const beforeEnd = body.ownerDocument.createRange();
      beforeEnd.selectNodeContents(body); beforeEnd.setEnd(range.endContainer, range.endOffset);
      return { start: beforeStart.toString().length, end: beforeEnd.toString().length };
    };

    const restoreTextSelection = saved => {
      if (!saved) return;
      const body = quickMailEditor.getBody();
      const walker = body.ownerDocument.createTreeWalker(body, NodeFilter.SHOW_TEXT);
      let position = 0, startNode, endNode, startOffset = 0, endOffset = 0;
      while (walker.nextNode()) {
        const node = walker.currentNode, next = position + node.data.length;
        if (!startNode && saved.start <= next) { startNode = node; startOffset = saved.start - position; }
        if (!endNode && saved.end <= next) { endNode = node; endOffset = saved.end - position; break; }
        position = next;
      }
      if (!startNode || !endNode) return;
      const range = body.ownerDocument.createRange();
      range.setStart(startNode, Math.max(0, startOffset));
      range.setEnd(endNode, Math.max(0, endOffset));
      quickMailEditor.selection.setRng(range);
    };

    window.quickmailCaptureTextSelection = () => captureTextSelection();
    window.quickmailRestoreTextSelection = saved => {
      restoreTextSelection(saved);
      quickMailEditor?.focus();
    };

    const addMenuButton = (menu, label, action) => {
      const item = menu.ownerDocument.createElement('button');
      item.type = 'button'; item.textContent = label;
      item.style.cssText = 'display:block;width:100%;border:0;background:transparent;padding:6px 18px;text-align:left;color:#111';
      item.onmouseenter = () => item.style.background = '#e8f0fe';
      item.onmouseleave = () => item.style.background = 'transparent';
      item.onmousedown = event => { event.preventDefault(); action(); closeQuickMailMenu(); };
      menu.appendChild(item);
    };

    const openQuickMailMenu = event => {
      const selected = quickMailEditor.selection.getContent({ format: 'text' });
      const spelling = event.target.closest?.('[data-quickmail-spelling]');
      if (!spelling && !selected.trim()) return;
      event.preventDefault(); closeQuickMailMenu();
      quickMailSelectionBookmark = quickMailEditor.selection.getBookmark(2, true);
      const doc = quickMailEditor.getDoc();
      const menu = doc.createElement('div');
      menu.dataset.quickmailMenu = 'true'; menu.contentEditable = 'false'; menu.setAttribute('data-mce-bogus', 'all');
      menu.style.cssText = `position:fixed;z-index:2147483647;left:${event.clientX}px;top:${event.clientY}px;min-width:180px;background:#fff;border:1px solid #999;box-shadow:0 3px 12px #0004;padding:4px 0;font:13px Segoe UI,sans-serif`;
      if (spelling) {
        const suggestions = JSON.parse(spelling.dataset.suggestions || '[]');
        suggestions.forEach(value => addMenuButton(menu, value, () => {
          spelling.replaceWith(spelling.ownerDocument.createTextNode(value)); emitContent(); requestCatalanProofing();
        }));
        if (suggestions.length) menu.appendChild(doc.createElement('hr'));
        addMenuButton(menu, 'Add to Dictionary', () => chrome.webview.postMessage(JSON.stringify({
          type: 'add-dictionary', word: spelling.textContent || ''
        })));
      }
      if (selected.trim()) {
        if (spelling) menu.appendChild(doc.createElement('hr'));
        const title = doc.createElement('div'); title.textContent = 'Translate';
        title.style.cssText = 'padding:5px 18px;color:#666;font-weight:600'; menu.appendChild(title);
        [['English','en'],['Spanish','es'],['Catalan','ca']].forEach(([label,target]) =>
          addMenuButton(menu, `Translate → ${label}`, () => chrome.webview.postMessage(JSON.stringify({
            type: 'translate-selection', text: selected, target
          }))));
        menu.appendChild(doc.createElement('hr'));
        addMenuButton(menu, 'Grammar Check…', () => chrome.webview.postMessage(JSON.stringify({
          type: 'grammar-check', text: selected
        })));
      }
      quickMailEditor.getBody().appendChild(menu);
    };

    window.quickmailApplyCatalanProofing = errors => {
      if (!quickMailEditor || quickMailLanguage !== 'ca-ES') return;
      const body = quickMailEditor.getBody();
      const savedSelection = captureTextSelection();
      body.querySelectorAll('[data-quickmail-spelling]').forEach(span => span.replaceWith(...span.childNodes));
      const lookup = new Map(Object.entries(errors).map(([word, suggestions]) => [word.toLocaleLowerCase('ca'), suggestions]));
      const walker = body.ownerDocument.createTreeWalker(body, NodeFilter.SHOW_TEXT);
      const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        if (node.parentElement?.closest('[data-quickmail-menu]')) continue;
        const fragment = body.ownerDocument.createDocumentFragment(); let last = 0; let changed = false;
        for (const match of node.data.matchAll(/[\p{L}·'’\-]+/gu)) {
          const suggestions = lookup.get(match[0].toLocaleLowerCase('ca'));
          if (!suggestions) continue;
          fragment.append(node.data.slice(last, match.index));
          const span = body.ownerDocument.createElement('span'); span.dataset.quickmailSpelling = 'true';
          span.dataset.suggestions = JSON.stringify(suggestions); span.textContent = match[0];
          span.style.textDecoration = 'underline wavy #d93025'; fragment.append(span);
          last = match.index + match[0].length; changed = true;
        }
        if (changed) { fragment.append(node.data.slice(last)); node.replaceWith(fragment); }
      }
      try { restoreTextSelection(savedSelection); } catch { /* content may have changed */ }
    };

    window.quickmailLoad = sourceBase64 => {
      const source = decodeUtf8Base64(sourceBase64);
      const parsed = new DOMParser().parseFromString(source, 'text/html');
      preservedHeadStyles = Array.from(parsed.head.querySelectorAll('style'))
        .map(style => style.outerHTML).join('');
      const contentCss = Array.from(parsed.head.querySelectorAll('style'))
        .map(style => style.textContent || '').join('\n');

      if (quickMailEditor) {
        quickMailEditor.remove();
        quickMailEditor = null;
      }

      hugerte.init({
        selector: '#editor',
        base_url: 'https://quickmail.local',
        suffix: '.min',
        height: '100%',
        resize: false,
        menubar: false,
        statusbar: false,
        branding: false,
        promotion: false,
        plugins: 'lists link image table code searchreplace',
        toolbar: 'undo redo | bold italic underline strikethrough | ' +
          'blocks | bullist numlist | link image table | removeformat code',
        toolbar_mode: 'wrap',
        browser_spellcheck: true,
        // Let Chromium own the context menu so its spelling suggestions and
        // "Add to dictionary" action appear directly under a misspelled word.
        contextmenu: false,
        convert_urls: false,
        relative_urls: false,
        remove_script_host: false,
        verify_html: false,
        valid_elements: '*[*]',
        extended_valid_elements: 'style[type|media]',
        content_style: contentCss + '\nbody{padding:10px;box-sizing:border-box}',
        setup: editor => {
          quickMailEditor = editor;
          editor.on('init', () => {
            editor.setContent(parsed.body.innerHTML || source);
            editor.getBody().lang = quickMailLanguage;
            editor.getBody().spellcheck = !!quickMailLanguage;
            editor.focus();
            emitContent();
            editor.getBody().addEventListener('contextmenu', openQuickMailMenu);
            requestCatalanProofing();
          });
          editor.on('input change undo redo SetContent', () => { emitContent(); requestCatalanProofing(); });
        }
      });
    };

    window.quickmailExec = (command, value) => {
      if (!quickMailEditor) return;
      quickMailEditor.execCommand(command, false, value ?? null);
      quickMailEditor.focus();
      emitContent();
    };

    window.quickmailInsertText = text => {
      if (!quickMailEditor) return;
      quickMailEditor.insertContent(quickMailEditor.dom.encode(text));
      quickMailEditor.focus();
      emitContent();
    };

    window.quickmailGetSelection = () => {
      if (!quickMailEditor) return '';
      quickMailSelectionBookmark = quickMailEditor.selection.getBookmark(2, true);
      return quickMailEditor.selection.getContent({ format: 'text' });
    };

    window.quickmailReplaceSelection = text => {
      if (!quickMailEditor) return;
      if (quickMailSelectionBookmark)
        quickMailEditor.selection.moveToBookmark(quickMailSelectionBookmark);
      quickMailEditor.selection.setContent(quickMailEditor.dom.encode(text));
      quickMailSelectionBookmark = null;
      quickMailEditor.focus();
      emitContent();
    };

    window.quickmailSetLanguage = language => {
      quickMailLanguage = language;
      document.documentElement.lang = language || '';
      if (!quickMailEditor) return;
      const body = quickMailEditor.getBody();
      body.spellcheck = false;
      body.removeAttribute('spellcheck');
      body.lang = language || '';
      body.setAttribute('spellcheck', language ? 'true' : 'false');
      body.spellcheck = !!language;
      body.focus();
      closeQuickMailMenu();
      if (language === 'ca-ES') requestCatalanProofing();
      else body.querySelectorAll('[data-quickmail-spelling]').forEach(span => span.replaceWith(...span.childNodes));
    };
  </script>
</body>
</html>
